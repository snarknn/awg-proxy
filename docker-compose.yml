services:
  awg-proxy:
    image: ghcr.io/snarknn/awg-proxy:latest
    container_name: awg-proxy
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Range for tunnel SOCKS5 ports. Exact ports are set in config/config.yml.
      # IMPORTANT: ports in config/config.yml must fall within this range,
      # but the container cannot verify this automatically.
      - "127.0.0.1:1080-1099:1080-1099/tcp"
    volumes:
      - ./config:/config:ro
      - ./config/config.yml:/config/config.yml:ro
    environment:
      # Only Docker/infrastructure settings here.
      # All app config (DNS, auth, watchdog, proxy) lives in config/config.yml.
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
    restart: unless-stopped